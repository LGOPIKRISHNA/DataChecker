                <option value="6">6 files</option>
                <option value="7">7 files</option>
                <option value="8">8 files</option>
                <option value="9">9 files</option>
                <option value="10">10 files</option>
            </select>
        </div>

<script>
const fileCountSelect = document.getElementById('fileCount');
const filesContainer = document.getElementById('filesContainer');
const compareBtn = document.getElementById('compareBtn');
const clearBtn = document.getElementById('clearBtn');
const result = document.getElementById('result');
const errorBox = document.getElementById('error');

function createFileInputs() {
    const count = Number(fileCountSelect.value);
    filesContainer.innerHTML = '';

    for (let i = 1; i <= count; i++) {
        const box = document.createElement('div');
        box.className = 'file-box';
        box.innerHTML = `
            <h3>Excel File ${i}</h3>
            <div class="small">Select .xlsx, .xls or .csv</div>
            <input type="file" class="excel-input" data-index="${i}" accept=".xlsx,.xls,.csv">
            <div id="name${i}" class="small"></div>
        `;
        filesContainer.appendChild(box);

        const input = box.querySelector('input');
        input.addEventListener('change', () => {
            const name = input.files[0] ? input.files[0].name : '';
            document.getElementById('name' + i).textContent = name;
        });
    }
}

fileCountSelect.addEventListener('change', createFileInputs);
createFileInputs();

function normalizeValue(value) {
    if (value === null || value === undefined) return '';

    if (value instanceof Date) {
        return value.toISOString();
    }

    if (typeof value === 'number') {
        if (Number.isNaN(value)) return '';
        return Number.isInteger(value) ? String(value) : String(value);
    }

    return String(value).trim();
}

function rowKey(row) {
    return row.map(normalizeValue).join('\u001F');
}

function makeRectangular(rows) {
    let maxCols = 0;
    rows.forEach(r => { if (r.length > maxCols) maxCols = r.length; });

    return rows.map(r => {
        const out = r.slice();
        while (out.length < maxCols) out.push('');
        return out.map(normalizeValue);
    });
}

async function readWorkbook(file) {
    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, {
        type: 'array',
        cellDates: true,
        raw: true
    });

    if (!workbook.SheetNames.length) {
        throw new Error('The workbook contains no worksheets.');
    }

    // The first worksheet is used for each uploaded workbook.
    const sheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];

    const rows = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: '',
        blankrows: true,
        raw: true
    });

    return {
        sheetName,
        rows: makeRectangular(rows)
    };
}

function countNonEmptyRows(rows) {
    return rows.filter(r => r.some(v => normalizeValue(v) !== '')).length;
}

function cleanTrailingEmptyRows(rows) {
    let end = rows.length;
    while (end > 0 && rows[end - 1].every(v => normalizeValue(v) === '')) end--;
    return rows.slice(0, end);
}

function buildRowMap(rows) {
    const map = new Map();

    rows.forEach((row, index) => {
        const key = rowKey(row);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(index + 1);
    });

    return map;
}

function compareAgainstReference(referenceRows, otherRows) {
    const refMap = buildRowMap(referenceRows);
    const otherMap = buildRowMap(otherRows);

    const missing = [];
    const extra = [];

    for (const [key, positions] of refMap.entries()) {
        const otherPositions = otherMap.get(key) || [];
        const common = Math.min(positions.length, otherPositions.length);

        for (let i = common; i < positions.length; i++) {
            missing.push({
                row: referenceRows[positions[i] - 1],
                referenceRow: positions[i]
            });
        }
    }

    for (const [key, positions] of otherMap.entries()) {
        const refPositions = refMap.get(key) || [];
        const common = Math.min(positions.length, refPositions.length);

        for (let i = common; i < positions.length; i++) {
            extra.push({
                row: otherRows[positions[i] - 1],
                otherRow: positions[i]
            });
        }
    }

    return {
        same: missing.length === 0 && extra.length === 0,
        missing,
        extra
    };
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function rowHtml(row, rowNumber, badgeClass, badgeText, maxCols) {
    const padded = row.concat(Array(maxCols - row.length).fill(''));

    return `<tr>
        <td><span class="badge ${badgeClass}">${badgeText}</span></td>
        <td>${rowNumber}</td>
        ${padded.map(v => `<td>${escapeHtml(v)}</td>`).join('')}
    </tr>`;
}

function renderResult(files, datasets, allComparisons) {
    const allSame = allComparisons.every(c => c.same);

    const maxCols = Math.max(
        ...datasets.map(d =>
            d.rows.reduce((m, r) => Math.max(m, r.length), 0)
        )
    );

    let totalMissing = 0;
    let totalExtra = 0;

    allComparisons.forEach(c => {
        totalMissing += c.missing.length;
        totalExtra += c.extra.length;
    });

    let html = `
        <div class="status ${allSame ? 'match' : 'not-match'}">
            ${allSame
                ? '✓ DATA MATCH — All uploaded Excel files contain the same data.'
                : '✗ DATA NOT MATCH — One or more uploaded Excel files contain differences.'}
        </div>

        <div class="summary">
            <div class="metric">
                <div class="number">${files.length}</div>
                <div class="label">Files Compared</div>
            </div>
            <div class="metric">
                <div class="number">${countNonEmptyRows(datasets[0].rows)}</div>
                <div class="label">Rows in File 1</div>
            </div>
            <div class="metric">
                <div class="number">${totalMissing + totalExtra}</div>
                <div class="label">Total Differences</div>
            </div>
            <div class="metric">
                <div class="number">${allSame ? '100%' : 'NOT MATCH'}</div>
                <div class="label">Overall Result</div>
            </div>
        </div>

        <h3 class="section-title">Uploaded Files</h3>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Input</th><th>File Name</th><th>Sheet</th><th>Rows</th><th>Status</th></tr>
                </thead>
                <tbody>
    `;

    files.forEach((file, i) => {
        const status = i === 0
            ? 'Reference'
            : (allComparisons[i - 1].same ? 'MATCH' : 'NOT MATCH');

        const badge = status === 'MATCH' || status === 'Reference'
            ? 'badge-extra'
            : 'badge-missing';

        html += `
            <tr>
                <td>Input ${i + 1}</td>
                <td>${escapeHtml(file.name)}</td>
                <td>${escapeHtml(datasets[i].sheetName)}</td>
                <td>${countNonEmptyRows(datasets[i].rows)}</td>
                <td><span class="badge ${badge}">${status}</span></td>
            </tr>
        `;
    });

    html += `</tbody></table></div>`;

    if (!allSame) {
        html += `<h3 class="section-title" style="margin-top:24px;">Differences</h3>`;

        allComparisons.forEach((comparison, index) => {
            if (comparison.same) return;

            const fileNumber = index + 2;
            html += `
                <h4>Input 1 vs Input ${fileNumber} — ${escapeHtml(files[fileNumber - 1].name)}</h4>
            `;

            html += `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Row</th>
                                ${Array.from({length: maxCols}, (_, i) => `<th>Column ${i + 1}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
            `;

            comparison.missing.forEach(item => {
                html += rowHtml(
                    item.row,
                    item.referenceRow,
                    'badge-missing',
                    `Missing in Input ${fileNumber}`,
                    maxCols
                );
            });

            comparison.extra.forEach(item => {
                html += rowHtml(
                    item.row,
                    item.otherRow,
                    'badge-extra',
                    `Extra in Input ${fileNumber}`,
                    maxCols
                );
            });

            html += `</tbody></table></div>`;
        });
    } else {
        html += `
            <div class="status match" style="margin-top:18px;">
                All records match across all ${files.length} files.
                Row order is ignored and duplicate records are counted correctly.
            </div>
        `;
    }

    html += `
        <p class="small">
            <strong>Comparison rule:</strong> Each row is treated as a complete record.
            Row order is ignored. Duplicate rows are counted. Every file is compared
            against Input 1. If any record is missing, extra, or duplicated differently,
            the overall result is NOT MATCH.
        </p>
    `;

    result.innerHTML = html;
    result.classList.remove('hidden');
}

compareBtn.addEventListener('click', async () => {
    errorBox.textContent = '';
    result.classList.add('hidden');

    const inputs = Array.from(document.querySelectorAll('.excel-input'));
    const files = inputs.map(input => input.files[0]);

    const missingInput = files.findIndex(file => !file);

    if (missingInput !== -1) {
        errorBox.textContent =
            `Please select a file for Input ${missingInput + 1}.`;
        return;
    }

    compareBtn.disabled = true;
    compareBtn.textContent = 'Comparing...';

    try {
        const datasets = await Promise.all(files.map(readWorkbook));

        datasets.forEach(d => {
            d.rows = cleanTrailingEmptyRows(d.rows);
        });

        const reference = datasets[0].rows;

        const comparisons = [];
        for (let i = 1; i < datasets.length; i++) {
            comparisons.push(
                compareAgainstReference(reference, datasets[i].rows)
            );
        }

        renderResult(files, datasets, comparisons);
    } catch (err) {
        console.error(err);
        errorBox.textContent =
            'Unable to read one or more Excel files. Please check that they are valid .xlsx/.xls/.csv files.';
    } finally {
        compareBtn.disabled = false;
        compareBtn.textContent = 'Compare Files';
    }
});

clearBtn.addEventListener('click', () => {
    fileCountSelect.value = '2';
    createFileInputs();
    errorBox.textContent = '';
    result.innerHTML = '';
    result.classList.add('hidden');
});
</script>

    return row.map(normalizeValue).join('\u001F');
}

function makeRectangular(rows) {
    let maxCols = 0;
    rows.forEach(r => { if (r.length > maxCols) maxCols = r.length; });

    return rows.map(r => {
        const out = r.slice();
        while (out.length < maxCols) out.push('');
        return out.map(normalizeValue);
    });
}

async function readWorkbook(file) {
    const buffer = await file.arrayBuffer();
    const workbook = XLSX.read(buffer, {
        type: 'array',
        cellDates: true,
        raw: true
    });

    if (!workbook.SheetNames.length) {
        throw new Error('The workbook contains no worksheets.');
    }

    // The first worksheet is used for each uploaded workbook.
    const sheetName = workbook.SheetNames[0];
    const sheet = workbook.Sheets[sheetName];

    const rows = XLSX.utils.sheet_to_json(sheet, {
        header: 1,
        defval: '',
        blankrows: true,
        raw: true
    });

    return {
        sheetName,
        rows: makeRectangular(rows)
    };
}

function countNonEmptyRows(rows) {
    return rows.filter(r => r.some(v => normalizeValue(v) !== '')).length;
}

function cleanTrailingEmptyRows(rows) {
    let end = rows.length;
    while (end > 0 && rows[end - 1].every(v => normalizeValue(v) === '')) end--;
    return rows.slice(0, end);
}

function buildRowMap(rows) {
    const map = new Map();

    rows.forEach((row, index) => {
        const key = rowKey(row);
        if (!map.has(key)) map.set(key, []);
        map.get(key).push(index + 1);
    });

    return map;
}

function compareAgainstReference(referenceRows, otherRows) {
    const refMap = buildRowMap(referenceRows);
    const otherMap = buildRowMap(otherRows);

    const missing = [];
    const extra = [];

    for (const [key, positions] of refMap.entries()) {
        const otherPositions = otherMap.get(key) || [];
        const common = Math.min(positions.length, otherPositions.length);

        for (let i = common; i < positions.length; i++) {
            missing.push({
                row: referenceRows[positions[i] - 1],
                referenceRow: positions[i]
            });
        }
    }

    for (const [key, positions] of otherMap.entries()) {
        const refPositions = refMap.get(key) || [];
        const common = Math.min(positions.length, refPositions.length);

        for (let i = common; i < positions.length; i++) {
            extra.push({
                row: otherRows[positions[i] - 1],
                otherRow: positions[i]
            });
        }
    }

    return {
        same: missing.length === 0 && extra.length === 0,
        missing,
        extra
    };
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
}

function rowHtml(row, rowNumber, badgeClass, badgeText, maxCols) {
    const padded = row.concat(Array(maxCols - row.length).fill(''));

    return `<tr>
        <td><span class="badge ${badgeClass}">${badgeText}</span></td>
        <td>${rowNumber}</td>
        ${padded.map(v => `<td>${escapeHtml(v)}</td>`).join('')}
    </tr>`;
}


let latestReport = null;

function buildReportData(files, datasets, allComparisons) {
    const allSame = allComparisons.every(c => c.same);
    const comparisons = allComparisons.map((c, index) => ({
        input: index + 2,
        fileName: files[index + 1].name,
        same: c.same,
        missing: c.missing,
        extra: c.extra
    }));

    return {
        generatedAt: new Date(),
        allSame,
        files,
        datasets,
        comparisons
    };
}

function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function safeFileName(name) {
    return String(name).replace(/[<>:"/\\|?*]+/g, '_').replace(/\s+/g, '_');
}

function downloadHtmlReport() {
    if (!latestReport) return;

    const r = latestReport;
    const generated = r.generatedAt.toLocaleString();
    const resultText = r.allSame ? 'DATA MATCH' : 'DATA NOT MATCH';

    let body = `
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Excel Data Tally Report</title>
<style>
body{font-family:Arial,sans-serif;margin:30px;color:#1f2937}
h1{margin-bottom:5px} .result{padding:15px;border-radius:8px;font-weight:bold}
.match{background:#dcfce7;color:#166534}.notmatch{background:#fee2e2;color:#991b1b}
table{border-collapse:collapse;width:100%;margin:12px 0 25px}
th,td{border:1px solid #ddd;padding:7px;text-align:left;font-size:13px}
th{background:#f1f5f9}.missing{background:#fee2e2}.extra{background:#fef3c7}
.small{color:#64748b;font-size:13px}
</style>
</head>
<body>
<h1>Excel Data Tally Report</h1>
<p class="small">Generated: ${escapeHtml(generated)}</p>
<div class="result ${r.allSame ? 'match' : 'notmatch'}">${resultText}</div>

<h2>Files Compared</h2>
<table>
<tr><th>Input</th><th>File Name</th><th>Sheet</th><th>Rows</th><th>Status</th></tr>
`;

    r.files.forEach((file, i) => {
        const status = i === 0 ? 'Reference' :
            (r.comparisons[i - 1].same ? 'MATCH' : 'NOT MATCH');
        body += `<tr>
            <td>Input ${i + 1}</td>
            <td>${escapeHtml(file.name)}</td>
            <td>${escapeHtml(r.datasets[i].sheetName)}</td>
            <td>${countNonEmptyRows(r.datasets[i].rows)}</td>
            <td>${status}</td>
        </tr>`;
    });

    body += `</table>`;

    if (r.allSame) {
        body += `<h2>Result</h2>
        <p>All uploaded files contain the same data. Row order was ignored and duplicate records were counted correctly.</p>`;
    } else {
        body += `<h2>Differences</h2>`;

        r.comparisons.forEach(c => {
            if (c.same) return;

            body += `<h3>Input 1 vs Input ${c.input} — ${escapeHtml(c.fileName)}</h3>`;

            if (c.missing.length) {
                body += `<h4>Missing in Input ${c.input}</h4><table><tr><th>Reference Row</th><th>Data</th></tr>`;
                c.missing.forEach(item => {
                    body += `<tr class="missing"><td>${item.referenceRow}</td><td>${escapeHtml(item.row.join(' | '))}</td></tr>`;
                });
                body += `</table>`;
            }

            if (c.extra.length) {
                body += `<h4>Extra in Input ${c.input}</h4><table><tr><th>Row</th><th>Data</th></tr>`;
                c.extra.forEach(item => {
                    body += `<tr class="extra"><td>${item.otherRow}</td><td>${escapeHtml(item.row.join(' | '))}</td></tr>`;
                });
                body += `</table>`;
            }
        });
    }

    body += `<h2>Comparison Rule</h2>
<p>Each row is treated as a complete record. Row order is ignored. Duplicate rows are counted. Every file is compared against Input 1.</p>
</body></html>`;

    downloadBlob(
        new Blob([body], {type: 'text/html;charset=utf-8'}),
        'excel_data_tally_report.html'
    );
}

function downloadExcelReport() {
    if (!latestReport) return;

    const r = latestReport;
    const wb = XLSX.utils.book_new();

    const resultText = r.allSame ? 'DATA MATCH' : 'DATA NOT MATCH';

    const summary = [
        ['EXCEL DATA TALLY REPORT'],
        ['Generated', r.generatedAt.toLocaleString()],
        ['Overall Result', resultText],
        ['Files Compared', r.files.length],
        [],
        ['Input', 'File Name', 'Sheet', 'Rows', 'Status']
    ];

    r.files.forEach((file, i) => {
        const status = i === 0 ? 'Reference' :
            (r.comparisons[i - 1].same ? 'MATCH' : 'NOT MATCH');

        summary.push([
            `Input ${i + 1}`,
            file.name,
            r.datasets[i].sheetName,
            countNonEmptyRows(r.datasets[i].rows),
            status
        ]);
    });

    summary.push([]);
    summary.push(['Comparison Rule']);
    summary.push(['Each row is treated as a complete record. Row order is ignored. Duplicate rows are counted. Every file is compared against Input 1.']);

    const wsSummary = XLSX.utils.aoa_to_sheet(summary);
    wsSummary['!cols'] = [
        {wch: 15}, {wch: 35}, {wch: 22}, {wch: 12}, {wch: 16}
    ];
    XLSX.utils.book_append_sheet(wb, wsSummary, 'Summary');

    const diffRows = [
        ['Compared Input', 'Status', 'Original Row', 'Data']
    ];

    r.comparisons.forEach(c => {
        c.missing.forEach(item => {
            diffRows.push([
                `Input ${c.input}`,
                `Missing in Input ${c.input}`,
                item.referenceRow,
                item.row.join(' | ')
            ]);
        });

        c.extra.forEach(item => {
            diffRows.push([
                `Input ${c.input}`,
                `Extra in Input ${c.input}`,
                item.otherRow,
                item.row.join(' | ')
            ]);
        });
    });

    if (diffRows.length === 1) {
        diffRows.push(['-', 'No differences', '-', '-']);
    }

    const wsDiff = XLSX.utils.aoa_to_sheet(diffRows);
    wsDiff['!cols'] = [
        {wch: 20}, {wch: 28}, {wch: 15}, {wch: 100}
    ];
    XLSX.utils.book_append_sheet(wb, wsDiff, 'Differences');

    const fileName = `excel_data_tally_report_${safeFileName(
        r.allSame ? 'MATCH' : 'NOT_MATCH'
    )}.xlsx`;

    XLSX.writeFile(wb, fileName);
}

function renderResult(files, datasets, allComparisons) {
    const allSame = allComparisons.every(c => c.same);

    const maxCols = Math.max(
        ...datasets.map(d =>
            d.rows.reduce((m, r) => Math.max(m, r.length), 0)
        )
    );

    let totalMissing = 0;
    let totalExtra = 0;

    allComparisons.forEach(c => {
        totalMissing += c.missing.length;
        totalExtra += c.extra.length;
    });

    let html = `
        <div class="status ${allSame ? 'match' : 'not-match'}">
            ${allSame
                ? '✓ DATA MATCH — All uploaded Excel files contain the same data.'
                : '✗ DATA NOT MATCH — One or more uploaded Excel files contain differences.'}
        </div>

        <div class="summary">
            <div class="metric">
                <div class="number">${files.length}</div>
                <div class="label">Files Compared</div>
            </div>
            <div class="metric">
                <div class="number">${countNonEmptyRows(datasets[0].rows)}</div>
                <div class="label">Rows in File 1</div>
            </div>
            <div class="metric">
                <div class="number">${totalMissing + totalExtra}</div>
                <div class="label">Total Differences</div>
            </div>
            <div class="metric">
                <div class="number">${allSame ? '100%' : 'NOT MATCH'}</div>
                <div class="label">Overall Result</div>
            </div>
        </div>

        <h3 class="section-title">Uploaded Files</h3>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr><th>Input</th><th>File Name</th><th>Sheet</th><th>Rows</th><th>Status</th></tr>
                </thead>
                <tbody>
    `;

    files.forEach((file, i) => {
        const status = i === 0
            ? 'Reference'
            : (allComparisons[i - 1].same ? 'MATCH' : 'NOT MATCH');

        const badge = status === 'MATCH' || status === 'Reference'
            ? 'badge-extra'
            : 'badge-missing';

        html += `
            <tr>
                <td>Input ${i + 1}</td>
                <td>${escapeHtml(file.name)}</td>
                <td>${escapeHtml(datasets[i].sheetName)}</td>
                <td>${countNonEmptyRows(datasets[i].rows)}</td>
                <td><span class="badge ${badge}">${status}</span></td>
            </tr>
        `;
    });

    html += `</tbody></table></div>`;

    if (!allSame) {
        html += `<h3 class="section-title" style="margin-top:24px;">Differences</h3>`;

        allComparisons.forEach((comparison, index) => {
            if (comparison.same) return;

            const fileNumber = index + 2;
            html += `
                <h4>Input 1 vs Input ${fileNumber} — ${escapeHtml(files[fileNumber - 1].name)}</h4>
            `;

            html += `
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th>Status</th>
                                <th>Row</th>
                                ${Array.from({length: maxCols}, (_, i) => `<th>Column ${i + 1}</th>`).join('')}
                            </tr>
                        </thead>
                        <tbody>
            `;

            comparison.missing.forEach(item => {
                html += rowHtml(
                    item.row,
                    item.referenceRow,
                    'badge-missing',
                    `Missing in Input ${fileNumber}`,
                    maxCols
                );
            });

            comparison.extra.forEach(item => {
                html += rowHtml(
                    item.row,
                    item.otherRow,
                    'badge-extra',
                    `Extra in Input ${fileNumber}`,
                    maxCols
                );
            });

            html += `</tbody></table></div>`;
        });
    } else {
        html += `
            <div class="status match" style="margin-top:18px;">
                All records match across all ${files.length} files.
                Row order is ignored and duplicate records are counted correctly.
            </div>
        `;
    }

    html += `
        <p class="small">
            <strong>Comparison rule:</strong> Each row is treated as a complete record.
            Row order is ignored. Duplicate rows are counted. Every file is compared
            against Input 1. If any record is missing, extra, or duplicated differently,
            the overall result is NOT MATCH.
        </p>
    `;

    html += `
        <div class="report-actions">
            <button type="button" onclick="downloadExcelReport()">Download Excel Report</button>
            <button type="button" class="secondary" onclick="downloadHtmlReport()">Download HTML Report</button>
        </div>
    `;

    latestReport = buildReportData(files, datasets, allComparisons);

    result.innerHTML = html;
    result.classList.remove('hidden');
}

compareBtn.addEventListener('click', async () => {
    errorBox.textContent = '';
    result.classList.add('hidden');

    const inputs = Array.from(document.querySelectorAll('.excel-input'));
    const files = inputs.map(input => input.files[0]);

    const missingInput = files.findIndex(file => !file);

    if (missingInput !== -1) {
        errorBox.textContent =
            `Please select a file for Input ${missingInput + 1}.`;
        return;
    }

    compareBtn.disabled = true;
    compareBtn.textContent = 'Comparing...';

    try {
        const datasets = await Promise.all(files.map(readWorkbook));

        datasets.forEach(d => {
            d.rows = cleanTrailingEmptyRows(d.rows);
        });

        const reference = datasets[0].rows;

        const comparisons = [];
        for (let i = 1; i < datasets.length; i++) {
            comparisons.push(
                compareAgainstReference(reference, datasets[i].rows)
            );
        }

        renderResult(files, datasets, comparisons);
    } catch (err) {
        console.error(err);
        errorBox.textContent =
            'Unable to read one or more Excel files. Please check that they are valid .xlsx/.xls/.csv files.';
    } finally {
        compareBtn.disabled = false;
        compareBtn.textContent = 'Compare Files';
    }
});

clearBtn.addEventListener('click', () => {
    fileCountSelect.value = '2';
    createFileInputs();
    errorBox.textContent = '';
    result.innerHTML = '';
    result.classList.add('hidden');
});
</script>

</body>
</html>
